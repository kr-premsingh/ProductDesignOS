services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pdos
      POSTGRES_PASSWORD: pdos_pass
      POSTGRES_DB: productdesignos
    ports:
      - "5432:5432"
    volumes:
      - pdos_postgres_data:/var/lib/postgresql/data
      - ../services/api/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  core-api:
    build:
      context: ../services/core-api
      dockerfile: Dockerfile
    environment:
      PORT: 4100
      DATABASE_URL: postgres://pdos:pdos_pass@postgres:5432/productdesignos
      JWT_SECRET: dev-secret
      ADMIN_EMAILS: ${ADMIN_EMAILS:-prem@productdesignos.com}
    ports:
      - "4100:4100"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_CORE_API_URL: http://localhost:4100
    environment:
      CORE_API_URL: http://core-api:4100
    ports:
      - "3000:3000"
    depends_on:
      - core-api

volumes:
  pdos_postgres_data:
