services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DOMAIN: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        API_URL: http://api:4000
        CORE_API_URL: http://core-api:4100
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_URL: http://api:4000
      CORE_API_URL: http://core-api:4100
    expose:
      - "3000"
    depends_on:
      - api
      - core-api

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy

  core-api:
    build:
      context: ../../services/core-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4100
      DATABASE_URL: postgres://${POSTGRES_USER:-pdos}:${POSTGRES_PASSWORD:-pdos_pass}@postgres:5432/${POSTGRES_DB:-productdesignos}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "4100"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdos_pass}
      POSTGRES_DB: ${POSTGRES_DB:-productdesignos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../services/api/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
