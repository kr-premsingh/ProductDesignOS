# Render Blueprint — free-tier deploy for productdesignos-core-api and productdesignos-api.
# Connect this repo at https://dashboard.render.com/blueprints (New -> Blueprint) and Render
# reads this file automatically. Postgres/Redis are intentionally NOT defined here — use
# a free external Postgres (Neon/Supabase) so data survives beyond Render's free-tier limits.
#
# After the first deploy, set these secrets in the Render dashboard (marked sync: false below):
#   - DATABASE_URL   (Neon/Supabase connection string, e.g. postgres://user:pass@host/db?sslmode=require)
#   - JWT_SECRET     (share the same value across both services so tokens are portable)

services:
  - type: web
    name: productdesignos-core-api
    env: docker
    plan: free
    dockerfilePath: services/core-api/Dockerfile
    dockerContext: services/core-api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: productdesignos-api
    env: docker
    plan: free
    dockerfilePath: services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_PROVIDER
        value: stub
